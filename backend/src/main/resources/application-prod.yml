spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

llm:
  api-key: ${LLM_API_KEY}
  api-base: ${LLM_API_BASE}
  model: ${LLM_MODEL}

image-gen:
  api-key: ${IMAGE_GEN_API_KEY}
  api-base: ${IMAGE_GEN_API_BASE}

speech-to-text:
  api-key: ${STT_API_KEY}
  api-base: ${STT_API_BASE}

logging:
  level:
    com.example.makemovie: INFO
